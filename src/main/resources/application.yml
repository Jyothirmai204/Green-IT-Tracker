server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/green_it_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
    username: root
    password: Root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: GreenITTrackerVerySecureSecretKeyForJWTAuthentication2026
  expiration: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html